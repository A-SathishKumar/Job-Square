version: '3.8'

services:
  # MongoDB Enterprise Primary
  mongodb:
    image: mongo:7.0-jammy
    container_name: jobsquare_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: jobsquare_admin
      MONGO_INITDB_ROOT_PASSWORD: ProductionPassword2026!
      MONGO_INITDB_DATABASE: jobsquare
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - jobsquare_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Hardened Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jobsquare_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://jobsquare_admin:ProductionPassword2026!@mongodb:27017/jobsquare?authSource=admin
      JWT_SECRET: jobsquare_enterprise_production_jwt_secret_key_super_secure_2026_OWASP
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      IP_SALT: jobsquare_production_ip_salt_2026
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobsquare_network

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jobsquare_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jobsquare_network

volumes:
  mongo_data:
    driver: local

networks:
  jobsquare_network:
    driver: bridge
